name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          rm -rf app/src
          mkdir -p app/src/main/java/com/example/goldwidget app/src/main/res/layout app/src/main/res/xml app/src/main/res/drawable app/src/main/res/values app/src/main/res/values-night
          cat > app/src/main/AndroidManifest.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="نرخ بازار" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".PriceWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/price_widget_info"/>
                  </receiver>
              </application>
          </manifest>
          E
          cat > app/src/main/res/xml/price_widget_info.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp" android:minHeight="140dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          E
          cat > app/src/main/res/values/colors.xml <<'E'
          <resources>
              <color name="card">#F2F2F7</color>
              <color name="txt">#000000</color>
              <color name="sub">#8E8E93</color>
              <color name="line">#D1D1D6</color>
          </resources>
          E
          cat > app/src/main/res/values-night/colors.xml <<'E'
          <resources>
              <color name="card">#1C1C1E</color>
              <color name="txt">#FFFFFF</color>
              <color name="sub">#8E8E93</color>
              <color name="line">#38383A</color>
          </resources>
          E
          cat > app/src/main/res/drawable/bg.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/card"/><corners android:radius="24dp"/>
          </shape>
          E
          cat > app/src/main/res/layout/widget.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:paddingLeft="18dp" android:paddingRight="18dp"
              android:paddingTop="12dp" android:paddingBottom="12dp"
              android:background="@drawable/bg" android:layoutDirection="rtl">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="نرخ بازار (تومان)" android:textColor="@color/sub" android:textSize="12sp" android:textStyle="bold"/>
                  <TextView android:id="@+id/time" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/sub" android:textSize="12sp"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"
                  android:orientation="horizontal" android:gravity="center_vertical">
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="💵 دلار" android:textColor="@color/txt" android:textSize="15sp"/>
                  <TextView android:id="@+id/usd" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/txt" android:textSize="17sp" android:textStyle="bold"/>
              </LinearLayout>
              <FrameLayout android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/line"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"
                  android:orientation="horizontal" android:gravity="center_vertical">
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="💶 یورو" android:textColor="@color/txt" android:textSize="15sp"/>
                  <TextView android:id="@+id/eur" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/txt" android:textSize="17sp" android:textStyle="bold"/>
              </LinearLayout>
              <FrameLayout android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/line"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"
                  android:orientation="horizontal" android:gravity="center_vertical">
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="🥇 طلا ۱۸ (گرم)" android:textColor="@color/txt" android:textSize="15sp"/>
                  <TextView android:id="@+id/gold" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/txt" android:textSize="17sp" android:textStyle="bold"/>
              </LinearLayout>
              <FrameLayout android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/line"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"
                  android:orientation="horizontal" android:gravity="center_vertical">
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="🪙 سکه امامی" android:textColor="@color/txt" android:textSize="15sp"/>
                  <TextView android:id="@+id/coin" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/txt" android:textSize="17sp" android:textStyle="bold"/>
              </LinearLayout>
          </LinearLayout>
          E
          cat > app/src/main/java/com/example/goldwidget/PriceWidget.kt <<'E'
          package com.example.goldwidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.NumberFormat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class PriceWidget : AppWidgetProvider() {
              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  val pending = goAsync()
                  thread { try { refresh(ctx, mgr, ids) } finally { pending.finish() } }
              }

              companion object {
                  private val ITEMS = listOf(
                      R.id.usd to "usd_sell",
                      R.id.eur to "eur_sell",
                      R.id.gold to "18ayar",
                      R.id.coin to "sekkeh"
                  )

                  fun refresh(ctx: Context, mgr: AppWidgetManager, widgetIds: IntArray) {
                      val key = ctx.getSharedPreferences("p", 0).getString("key", "") ?: ""
                      val views = RemoteViews(ctx.packageName, R.layout.widget)
                      try {
                          if (key.isBlank()) throw IllegalStateException("کلید API را در اپ وارد کنید")
                          val c = URL("https://api.navasan.tech/latest/?api_key=$key").openConnection() as HttpURLConnection
                          c.connectTimeout = 10000; c.readTimeout = 10000
                          val json = JSONObject(c.inputStream.bufferedReader().readText())
                          val nf = NumberFormat.getInstance(Locale("fa"))
                          for ((viewId, k) in ITEMS) {
                              val v = json.optJSONObject(k)?.optString("value")?.toDoubleOrNull()
                              views.setTextViewText(viewId, v?.let { nf.format(it.toLong()) } ?: "—")
                          }
                          views.setTextViewText(R.id.time, SimpleDateFormat("HH:mm", Locale.US).format(Date()))
                      } catch (e: Exception) {
                          views.setTextViewText(R.id.time, "خطا: " + (e.message ?: "نامشخص"))
                      }
                      val i = Intent(ctx, PriceWidget::class.java).setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE)
                          .putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, widgetIds)
                      views.setOnClickPendingIntent(R.id.root,
                          PendingIntent.getBroadcast(ctx, 0, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      for (id in widgetIds) mgr.updateAppWidget(id, views)
                  }
              }
          }
          E
          cat > app/src/main/java/com/example/goldwidget/MainActivity.kt <<'E'
          package com.example.goldwidget

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.os.Bundle
          import android.widget.*
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = getSharedPreferences("p", 0)
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
                  val info = TextView(this).apply {
                      text = "۱) کلید API رایگان را از navasan.tech بگیرید و اینجا وارد کنید.\n۲) ذخیره بزنید.\n۳) روی صفحه اصلی گوشی نگه دارید ← Widgets ← «نرخ بازار»."
                      textSize = 16f
                  }
                  val et = EditText(this).apply { hint = "API Key"; setText(p.getString("key", "")); setSingleLine() }
                  val btn = Button(this).apply { text = "ذخیره و رفرش" }
                  btn.setOnClickListener {
                      p.edit().putString("key", et.text.toString().trim()).apply()
                      val m = AppWidgetManager.getInstance(this)
                      val ids = m.getAppWidgetIds(ComponentName(this, PriceWidget::class.java))
                      thread { PriceWidget.refresh(applicationContext, m, ids) }
                      Toast.makeText(this, "ذخیره شد", Toast.LENGTH_SHORT).show()
                  }
                  box.addView(info); box.addView(et); box.addView(btn)
                  setContentView(box)
              }
          }
          E
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
