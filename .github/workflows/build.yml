                              <TextView android:id="@+id/coin_p" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000" android:textSize="28sp" android:textStyle="bold" android:maxLines="1"/>
                              <TextView android:id="@+id/coin_m" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000" android:textSize="16sp" android:textStyle="bold"/>
