              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_margin="4dp" android:padding="12dp" android:orientation="vertical" android:background="@drawable/card_bg">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                          <TextView android:layout_width="34dp" android:layout_height="34dp" android:gravity="center" android:background="@drawable/c_gram" android:text="g" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold"/>
                          <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="end" android:text="Gram" android:textColor="#000000" android:textSize="13sp"/>
                              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="end" android:text="GRAM" android:textColor="#8E8E93" android:textSize="11sp"/>
                          </LinearLayout>
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical" android:gravity="bottom">
                          <TextView android:id="@+id/gold_c" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="14sp" android:textStyle="bold"/>
                          <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="bottom">
                              <TextView android:id="@+id/gold_p" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000" android:textSize="28sp" android:textStyle="bold" android:maxLines="1"/>
