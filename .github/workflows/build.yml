          cat > app/src/main/java/com/example/goldwidget/PriceWidget.kt <<'E'
          package com.example.goldwidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.style.RelativeSizeSpan
          import android.widget.RemoteViews
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.concurrent.thread
          import kotlin.math.abs

          class PriceWidget : AppWidgetProvider() {
              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  val pending = goAsync()
                  thread { try { refresh(ctx, mgr, ids) } finally { pending.finish() } }
              }

              companion object {
                  private val ITEMS = listOf(
                      Triple("usd_sell", R.id.usd_p, R.id.usd_c),
                      Triple("eur_sell", R.id.eur_p, R.id.eur_c),
                      Triple("18ayar", R.id.gold_p, R.id.gold_c),
                      Triple("sekkeh", R.id.coin_p, R.id.coin_c)
                  )

                  private fun price(v: Double): CharSequence {
                      val s = SpannableStringBuilder()
                      if (v >= 1e6) {
                          s.append(String.format(Locale.US, "%.3f", v / 1e6))
                          val st = s.length
                          s.append("M")
                          s.setSpan(RelativeSizeSpan(0.55f), st, s.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      } else s.append(String.format(Locale.US, "%,d", v.toLong()))
                      return s
                  }

                  private fun short(x: Double): String = when {
                      x >= 1e6 -> String.format(Locale.US, "%.2fM", x / 1e6)
                      x >= 1e3 -> String.format(Locale.US, "%.2fK", x / 1e3)
                      else -> String.format(Locale.US, "%.0f", x)
                  }

                  fun refresh(ctx: Context, mgr: AppWidgetManager, widgetIds: IntArray) {
                      val p = ctx.getSharedPreferences("p", 0)
                      val key = p.getString("key", "") ?: ""
                      val views = RemoteViews(ctx.packageName, R.layout.widget)
                      try {
                          if (key.isBlank()) throw IllegalStateException("API key?")
                          val c = URL("https://api.navasan.tech/latest/?api_key=$key").openConnection() as HttpURLConnection
                          c.connectTimeout = 10000; c.readTimeout = 10000
                          val json = JSONObject(c.inputStream.bufferedReader().readText())
                          for ((k, pid, cid) in ITEMS) {
                              val o = json.optJSONObject(k)
                              val v = o?.optString("value")?.toDoubleOrNull()
                              if (v == null) { views.setTextViewText(pid, "—"); views.setTextViewText(cid, ""); continue }
                              val last = p.getString("l_$k", null)?.toDoubleOrNull()
                              val d = o.optString("change").toDoubleOrNull() ?: (if (last != null) v - last else 0.0)
                              p.edit().putString("l_$k", v.toString()).apply()
                              views.setTextViewText(pid, price(v))
                              if (d == 0.0) views.setTextViewText(cid, " ")
                              else {
                                  views.setTextViewText(cid, (if (d > 0) "↑" else "↓") + short(abs(d)))
                                  views.setTextColor(cid, ctx.getColor(if (d > 0) R.color.up else R.color.down))
                              }
                          }
                      } catch (e: Exception) {
                          views.setTextViewText(R.id.usd_c, "خطا: " + (e.message ?: ""))
                          views.setTextColor(R.id.usd_c, ctx.getColor(R.color.up))
                      }
                      val i = Intent(ctx, PriceWidget::class.java).setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE)
                          .putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, widgetIds)
                      views.setOnClickPendingIntent(R.id.root,
                          PendingIntent.getBroadcast(ctx, 0, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      for (id in widgetIds) mgr.updateAppWidget(id, views)
                  }
              }
          }
          E
