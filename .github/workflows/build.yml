          E
          cat > app/src/main/java/com/example/goldwidget/PriceWidget.kt <<'E'
          package com.example.goldwidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.widget.RemoteViews
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.concurrent.thread
          import kotlin.math.abs

          class PriceWidget : AppWidgetProvider() {
              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  val pending = goAsync()
                  thread { try { refresh(ctx, mgr, ids) } catch (e: Throwable) { } finally { pending.finish() } }
              }

              companion object {
                  private val ITEMS = listOf(
                      arrayOf("usd_sell", "usd"),
                      arrayOf("eur_sell", "eur"),
                      arrayOf("18ayar", "gold"),
                      arrayOf("sekkeh", "coin")
                  )

                  private fun id(ctx: Context, name: String): Int =
                      ctx.resources.getIdentifier(name, "id", ctx.packageName)

                  private fun short(x: Double): String = when {
                      x >= 1e6 -> String.format(Locale.US, "%.2fM", x / 1e6)
                      x >= 1e3 -> String.format(Locale.US, "%.2fK", x / 1e3)
                      else -> String.format(Locale.US, "%.0f", x)
                  }

                  private fun show(ctx: Context, views: RemoteViews, slot: String, v: Double, d: Double) {
                      val big = v >= 1e6
                      views.setTextViewText(id(ctx, slot + "_p"),
                          if (big) String.format(Locale.US, "%.3f", v / 1e6) else String.format(Locale.US, "%,d", v.toLong()))
                      views.setTextViewText(id(ctx, slot + "_m"), if (big) "M" else "")
                      val c = id(ctx, slot + "_c")
                      if (d == 0.0) views.setTextViewText(c, " ")
                      else {
                          views.setTextViewText(c, (if (d > 0) "↑" else "↓") + short(abs(d)))
                          views.setTextColor(c, Color.parseColor(if (d > 0) "#D93025" else "#2E7D4F"))
                      }
                  }

                  fun refresh(ctx: Context, mgr: AppWidgetManager, widgetIds: IntArray) {
                      val p = ctx.getSharedPreferences("p", 0)
                      val key = p.getString("key", "") ?: ""
                      val views = RemoteViews(ctx.packageName, R.layout.widget)
                      var err: String? = null
                      try {
                          if (key.isBlank()) throw IllegalStateException("API key?")
                          val con = URL("https://api.navasan.tech/latest/?api_key=$key").openConnection() as HttpURLConnection
                          con.connectTimeout = 10000; con.readTimeout = 10000
                          val json = JSONObject(con.inputStream.bufferedReader().readText())
                          for (it in ITEMS) {
                              val o = json.optJSONObject(it[0]) ?: continue
                              val v = o.optString("value").toDoubleOrNull() ?: continue
                              val last = p.getString("l_" + it[0], null)?.toDoubleOrNull()
                              val d = o.optString("change").toDoubleOrNull() ?: (if (last != null) v - last else 0.0)
                              p.edit().putString("l_" + it[0], v.toString()).putString("d_" + it[0], d.toString()).apply()
                          }
                      } catch (e: Throwable) {
                          err = e.message ?: "error"
                      }
                      for (it in ITEMS) {
                          val v = p.getString("l_" + it[0], null)?.toDoubleOrNull()
                          val d = p.getString("d_" + it[0], null)?.toDoubleOrNull() ?: 0.0
                          if (v != null) show(ctx, views, it[1], v, d)
                          else views.setTextViewText(id(ctx, it[1] + "_p"), "—")
                      }
                      if (err != null) {
                          views.setTextViewText(R.id.usd_c, "!")
                          views.setTextColor(R.id.usd_c, Color.parseColor("#D93025"))
                      }
                      val i = Intent(ctx, PriceWidget::class.java).setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE)
                          .putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, widgetIds)
                      views.setOnClickPendingIntent(R.id.root,
                          PendingIntent.getBroadcast(ctx, 0, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      for (w in widgetIds) mgr.updateAppWidget(w, views)
                  }
              }
          }
          E
          cat > app/src/main/java/com/example/goldwidget/MainActivity.kt <<'E'
          package com.example.goldwidget

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.os.Bundle
          import android.widget.*
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = getSharedPreferences("p", 0)
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
                  val info = TextView(this).apply {
                      text = "۱) کلید API رایگان را از navasan.tech بگیرید و اینجا وارد کنید.\n۲) ذخیره بزنید.\n۳) روی صفحه اصلی گوشی نگه دارید ← Widgets ← «نرخ بازار»."
                      textSize = 16f
                  }
                  val et = EditText(this).apply { hint = "API Key"; setText(p.getString("key", "")); setSingleLine() }
                  val btn = Button(this).apply { text = "ذخیره و رفرش" }
                  btn.setOnClickListener {
                      p.edit().putString("key", et.text.toString().trim()).apply()
                      val m = AppWidgetManager.getInstance(this)
                      val ids = m.getAppWidgetIds(ComponentName(this, PriceWidget::class.java))
                      thread { try { PriceWidget.refresh(applicationContext, m, ids) } catch (e: Throwable) { } }
                      Toast.makeText(this, "ذخیره شد", Toast.LENGTH_SHORT).show()
                  }
             
