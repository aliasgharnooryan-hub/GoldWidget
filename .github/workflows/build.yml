              android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="4dp">
              <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_margin="4dp" android:padding="12dp" android:orientation="vertical" android:background="@drawable/card_bg">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                          <TextView android:layout_width="34dp" android:layout_height="34dp" android:gravity="center" android:background="@drawable/c_usd" android:text="$" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold"/>
                          <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="end" android:text="US Dollar" android:textColor="#000000" android:textSize="13sp"/>
                              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="end" android:text="USD" android:textColor="#8E8E93" android:textSize="11sp"/>
                          </LinearLayout>
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical" android:gravity="bottom">
                          <TextView android:id="@+id/usd_c" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="14sp" android:textStyle="bold"/>
                          <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="bottom">
                              <TextView android:id="@+id/usd_p" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000" android:textSize="28sp" android:textStyle="bold" android:maxLines="1"/>
                              <TextView android:id="@+id/usd_m" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000" android:textSize="16sp" android:textStyle="bold"/>
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_margin="4dp" android:padding="12dp" android:orientation="vertical" android:background="@drawable/card_bg">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                          <TextView android:layout_width="34dp" android:layout_height="34dp" android:gravity="center" android:background="@drawable/c_eur" android:text="€" android:textColor="#FFCC00" android:textSize="18sp" android:textStyle="bold"/>
                          <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="end" android:text="Euro" android:textColor="#000000" android:textSize="13sp"/>
                              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="end" android:text="EUR" android:textColor="#8E8E93" android:textSize="11sp"/>
                          </LinearLayout>
                      </LinearLayout>
                      <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical" android:gravity="bottom">
                          <TextView android:id="@+id/eur_c" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="14sp" android:textStyle="bold"/>
                          <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="bottom">
                              <TextView android:id="@+id/eur_p" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000" android:textSize="28sp" android:textStyle="bold" android:maxLines="1"/>
                              <TextView android:id="@+id/eur_m" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#000000" android:textSize="16sp" android:textStyle="bold"/>
                          </LinearLayout>
